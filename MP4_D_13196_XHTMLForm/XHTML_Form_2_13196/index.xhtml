<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Formulir Pendaftaran Kegiatan</title>
    </head>
    
    <body>
        <h1>Formulir Pendaftaran Kegiatan</h1>
        <form action="" method="post" enctype="multipart/form-data">
            <h2>Data Pendaftar</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;">
                        <label for="fullname">
                            <strong>Nama Lengkap</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="fullname" name="fullname" size="30"/>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="id">
                            <strong>NIM</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="id" name="id" size="30"/>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="id">
                            <strong>Program Studi</strong>
                        </label>
                    </td>
                    <td>
                        <select id="id" name="id">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>Jenis Kelamin</strong>
                    </td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male"/>
                        <label for="male">Laki-Laki</label>
                        <input type="radio" id="female" name="gender" value="female"/>
                        <label for="female">Perempuan</label>
                    </td>
                </tr>
            </table>

            <h2>Pilihan Kegiatan</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;">
                        <strong>Jenis Kegiatan</strong>
                    </td>
                    <td>
                        <input type="radio" id="seminar" name="options" value="seminar"/>
                        <label for="seminar">Seminar</label>
                        <input type="radio" id="pelatihan" name="options" value="pelatihan"/>
                        <label for="pelatihan">Pelatihan</label>
                        <input type="radio" id="diskusi" name="options" value="diskusi"/>
                        <label for="diskusi">Diskusi</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>Bidang Minat</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="teknologi" name="bidang" value="teknologi"/>
                            <label for="teknologi">Teknologi</label>
                        </p>
                        <p>
                            <input type="checkbox" id="organisasi" name="bidang" value="organisasi"/>
                            <label for="organisasi">Organisasi</label>
                        </p>
                        <p>
                            <input type="checkbox" id="karier" name="bidang" value="karier"/>
                            <label for="karier">Karier</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="time">
                            <strong>Waktu Kegiatan</strong>
                        </label>
                    </td>
                    <td>
                        <select id="time" name="time">
                            <option>Pagi</option>
                            <option>Siang</option>
                            <option>Sore</option>
                        </select>
                    </td>
                </tr>
            </table>

            <h2>Kelengkapan Pendaftaran</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;">
                        <label for="harapan">
                            <strong>Harapan Mengikuti Kegiatan</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="harapan" name="harapan" rows="10" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="file">
                            <strong>Bukti Pembayaran</strong>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="file" name="file" accept="application/pdf, image/jpeg, image.png"/>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" name="pendaftaran" value="Kirim" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
